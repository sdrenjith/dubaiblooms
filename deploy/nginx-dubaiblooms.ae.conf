upstream dubaiblooms_api {
  server 127.0.0.1:5000;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name dubaiblooms.ae www.dubaiblooms.ae;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name dubaiblooms.ae www.dubaiblooms.ae;

  ssl_certificate /etc/letsencrypt/live/dubaiblooms.ae/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dubaiblooms.ae/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /home/dubaiblooms/frontend/dist;
  index index.html;

  access_log /var/log/nginx/dubaiblooms.ae.access.log;
  error_log /var/log/nginx/dubaiblooms.ae.error.log;

  # ^~ so requests like /uploads/photo.PNG are not captured by the regex static-asset
  # location below (which would try frontend/dist/uploads/... and return 404).
  location ^~ /api/ {
    proxy_pass http://dubaiblooms_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 55M;
  }

  location ^~ /uploads/ {
    proxy_pass http://dubaiblooms_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 12M;
  }

  location = /sitemap.xml {
    proxy_pass http://dubaiblooms_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ @spa;
  }

  location @spa {
    proxy_pass http://dubaiblooms_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
